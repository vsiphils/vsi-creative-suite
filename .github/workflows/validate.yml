name: Validate app catalog
on:
  push:
    branches: [main]
    paths: [catalog/**, scripts/validate-catalog.ps1, .github/workflows/validate.yml]
  pull_request:
    paths: [catalog/**, scripts/validate-catalog.ps1, .github/workflows/validate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog schema and app definitions
        shell: pwsh
        run: ./scripts/validate-catalog.ps1
